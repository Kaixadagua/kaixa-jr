version: '3.8'

services:
  kaixa-jr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaixa-jr
    restart: unless-stopped
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      # Add other env vars from .env file
    
    # Volumes for persistence
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./reports:/app/reports
    
    # Optional: expose port for future web interface
    # ports:
    #   - "3000:3000"
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add monitoring with Prometheus/Grafana
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: kaixa-prometheus
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: kaixa-grafana
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - grafana-data:/var/lib/grafana

# Volumes
volumes:
  grafana-data:
